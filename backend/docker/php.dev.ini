; PHP settings for the development container — same upload limits as production,
; but errors are visible and nothing is cached.
upload_max_filesize = 24M
post_max_size = 32M
max_file_uploads = 20
memory_limit = 512M
max_execution_time = 0

display_errors = On
log_errors = On
error_log = /dev/stderr

opcache.enable = 0
