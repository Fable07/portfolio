# nginx for the production API image. Serves public/ and hands .php to php-fpm.
user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logs go to the container's stdout/stderr so `docker logs` shows them
    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Must be at least as large as the upload limit in docker/php.ini
    client_max_body_size 32M;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 80 default_server;
        server_name _;
        root /app/public;
        index index.php;

        add_header X-Content-Type-Options nosniff always;

        # Uploaded media and other public files, then Laravel's front controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT $document_root;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
        }

        # Never serve dotfiles (.env, .git, …)
        location ~ /\. {
            deny all;
        }
    }
}
