; PHP settings for the API container.
; The upload limits must stay above the per-file limits in app/Support/MediaRules.php
; (images 5 MB, videos 20 MB) or PHP rejects the request before Laravel validates it.
upload_max_filesize = 24M
post_max_size = 32M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 60

; Errors go to the container log, never to the HTTP response
display_errors = Off
log_errors = On
error_log = /dev/stderr

expose_php = Off

; Bytecode cache — the biggest single speed-up for a PHP app in production
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 0
