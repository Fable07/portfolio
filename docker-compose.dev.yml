# Development stack — frontend + API, both with hot reload.
#
#   docker compose -f docker-compose.dev.yml up --build
#   → site  http://localhost:5173
#   → API   http://localhost:8000/api
#
# Monorepo layout: this file lives at the repo root, and both services build
# from the sibling ./backend and ./frontend directories below it.
# Both services read the same Supabase database (one database for dev and prod —
# see DEPLOYMENT.md), so keep migrations additive.
services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    environment:
      # The browser calls the API directly, so CORS must allow the dev origin
      FRONTEND_URLS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - '8000:8000'
    volumes:
      # Live code, but keep the container's vendor/ (installed for Linux)
      - ./backend:/app
      - backend-vendor:/app/vendor

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_URL: http://localhost:8000/api
    ports:
      - '5173:5173'
    volumes:
      # Live code, but keep the container's node_modules (installed for Linux)
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - api

volumes:
  frontend-node-modules:
  backend-vendor:
