# nginx config for the production image.
#
# Two things matter for a Vue SPA:
#  1. Unknown paths must return index.html, otherwise reloading /projects/3 is a 404
#     (the router lives in the browser, the server knows nothing about those URLs).
#  2. Hashed build assets (app-a1b2c3.js) can be cached forever; index.html must not be,
#     or visitors keep the old app after a deploy.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip the text assets (Vite already minifies them)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Small hardening defaults
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Hashed assets: immutable, cache for a year
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything else: serve the file if it exists, otherwise hand over to the SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always be revalidated so deploys take effect immediately
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Container health check target (used by docker-compose)
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
